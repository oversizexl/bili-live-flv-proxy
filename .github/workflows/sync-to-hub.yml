name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - app.py
      - Dockerfile
      - requirements.txt
      - .github/workflows/sync-to-hub.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Hugging Face CLI
        run: |
          if ! { curl -LsSf https://hf.co/cli/install.sh | bash; } > /tmp/hf-install.log 2>&1; then
            echo "Hugging Face CLI 安装失败："
            cat /tmp/hf-install.log
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "Hugging Face CLI 安装完成"

      - name: 上传部署文件
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          set -uo pipefail

          if [ -z "${HF_SPACE_REPO:-}" ]; then
            echo "错误：未设置仓库变量 HF_SPACE_REPO"
            exit 1
          fi

          echo "目标 Space：${HF_SPACE_REPO}"
          echo "同步文件：app.py、Dockerfile、requirements.txt"

          SPACE_URL="https://huggingface.co/spaces/${HF_SPACE_REPO}"
          BEFORE=$(git ls-remote "${SPACE_URL}" refs/heads/main 2>/dev/null | cut -f1 || true)

          # 只上传部署文件，不加 --delete，Space 的 README.md 不会被上传或删除
          if ! OUTPUT=$(hf upload "${HF_SPACE_REPO}" . --type space \
              --exclude=".git*" --exclude="*/.git/" --exclude="*/.github/" \
              --include="app.py" --include="Dockerfile" --include="requirements.txt" \
              --commit-message "从 GitHub 同步 ${GITHUB_SHA::7}" 2>&1); then
            echo "同步失败，错误信息如下："
            echo "${OUTPUT}"
            exit 1
          fi

          AFTER=$(git ls-remote "${SPACE_URL}" refs/heads/main 2>/dev/null | cut -f1 || true)

          if echo "${OUTPUT}" | grep -qi "no files have been modified" \
              || { [ -n "${BEFORE}" ] && [ -n "${AFTER}" ] && [ "${BEFORE}" = "${AFTER}" ]; }; then
            echo "同步完成：文件没有变化，Space 无需重新构建"
          elif [ -n "${AFTER}" ]; then
            echo "同步完成：已生成新提交 ${AFTER:0:7}，Space 将自动重新构建"
          else
            echo "同步完成：已上传变更，Space 将自动重新构建"
          fi
